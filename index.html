 ['Tra cứu không ra hóa đơn đầu vào, cổng quá tải','hóa đơn đầu vào mua vào tra cứu quá tải captcha','Kiểm tra đúng MST bên bán, ký hiệu, số hóa đơn|Nhập lại mã captcha, thử giờ ít người dùng|Đổi trình duyệt, xóa cache|Hóa đơn mới lập có thể cần chờ dữ liệu đồng bộ|Hỏi lại bên bán xem đã gửi lên cơ quan thuế chưa','Dạ, hóa đơn chưa hiện có thể do dữ liệu chưa đồng bộ hoặc cổng đang đông. Em thử lại giờ khác và kiểm tra với bên bán xem đã gửi hóa đơn lên cơ quan thuế chưa ạ.']]},
{id:'bhxh',name:'Bảo hiểm xã hội',icon:'🛡️',c:'#be123c',url:'https://baohiemxahoi.gov.vn/',
 intro:'Tra cứu mã số BHXH, thẻ BHYT, quá trình đóng và giao dịch điện tử với cơ quan BHXH.',
 docs:[['Các kênh chính thức','Cổng thông tin baohiemxahoi.gov.vn để tra cứu, cổng giao dịch điện tử dichvucong.baohiemxahoi.gov.vn để nộp hồ sơ, ứng dụng VssID trên điện thoại.'],['Hiểu mã số','Mã số BHXH là mã định danh của người tham gia. Mã thẻ BHYT dùng để tra giá trị sử dụng thẻ. Hiện nhiều trường hợp dùng số CCCD thay thế.'],['Lưu ý khi tra cứu','Cổng có thể gửi mã OTP về email đã đăng ký. Chỉ nhập thông tin trên địa chỉ chính thức.']],
 errs:[
 ['Không tra cứu được mã số BHXH','tra cứu mã số bhxh cccd otp','Nhập đúng họ tên, ngày sinh, số CCCD đúng như đã đăng ký|Nếu trang yêu cầu OTP, kiểm tra email đã đăng ký (cả thư rác)|Thử tra bằng ứng dụng VssID|Thông tin đăng ký cũ hoặc sai: nhờ cơ quan BHXH hoặc đơn vị sử dụng lao động điều chỉnh','Dạ, em chưa tra ra mã số do thông tin nhập chưa khớp với dữ liệu BHXH. Anh/chị cho em họ tên, ngày sinh theo giấy tờ, em kiểm tra lại. Nếu vẫn không ra thì cần nhờ cơ quan BHXH cập nhật ạ.'],
 ['Không đăng nhập được cổng giao dịch BHXH điện tử','giao dịch điện tử đăng nhập ivan token','Kiểm tra token còn hạn, đúng đơn vị|Cài phần mềm ký số/ trình ký theo hướng dẫn của nhà cung cấp dịch vụ|Dùng Chrome/Edge, cho phép popup|Kiểm tra tài khoản giao dịch đã được duyệt chưa|Liên hệ nhà cung cấp dịch vụ I-VAN nếu lỗi kết nối','Dạ, cổng giao dịch BHXH cần chữ ký số để đăng nhập nên em sẽ kiểm tra lại thiết bị và phần mềm. Anh/chị cắm sẵn USB chữ ký số giúp em ạ.'],
 ['VssID không đăng nhập hoặc chưa kích hoạt','vssid bhxh số kích hoạt ứng dụng','Cập nhật ứng dụng VssID bản mới nhất|Đăng nhập bằng số CCCD/định danh đã đăng ký|Kiểm tra số điện thoại nhận mã xác thực|Chưa có tài khoản thì đăng ký trong ứng dụng hoặc qua cổng dịch vụ công BHXH','Dạ, anh/chị cập nhật ứng dụng VssID lên bản mới rồi đăng nhập bằng số CCCD. Nếu chưa nhận được mã xác thực, anh/chị gửi em ảnh màn hình để em hướng dẫn tiếp ạ.'],
 ['Tra cứu thẻ BHYT không ra hoặc báo hết hạn','thẻ bhyt hết hạn giá trị sử dụng tra cứu','Tra bằng mã thẻ, họ tên, ngày sinh đúng|Đối chiếu trên VssID|Kiểm tra kỳ đóng BHYT gần nhất đã ghi nhận chưa|Nếu mới đóng, chờ cập nhật dữ liệu|Vẫn lỗi: liên hệ cơ quan BHXH nơi tham gia','Dạ, thẻ BHYT của anh/chị đang báo chưa đúng nên em kiểm tra lại kỳ đóng. Có thể do dữ liệu mới đóng chưa cập nhật. Em sẽ đối chiếu trên VssID và báo anh/chị ngay ạ.']]},
{id:'dvc',name:'Dịch vụ công Quốc gia',icon:'🏛️',c:'#b45309',url:'https://dichvucong.gov.vn/',
 intro:'Cổng nộp hồ sơ trực tuyến và tra cứu thủ tục hành chính trên toàn quốc, đăng nhập bằng VNeID.',
 docs:[['VNeID mức 2','Để đăng nhập cần tài khoản định danh điện tử mức 2. Chưa kích hoạt thì ra công an xã/phường để làm.'],['Tệp đính kèm','Hồ sơ thường cần PDF hoặc ảnh rõ nét, dung lượng giới hạn. Nén tệp nếu quá lớn.'],['Giờ cao điểm','Đầu giờ sáng và cuối hạn nộp hệ thống hay chậm. Nên nộp sớm và lưu mã hồ sơ.']],
 errs:[
 ['Không đăng nhập được bằng VNeID','vneid định danh mức 2 đăng nhập nfc','Kiểm tra tài khoản VNeID đã kích hoạt mức 2|Cập nhật ứng dụng VNeID bản mới, bật thông báo|Đăng nhập bằng mã QR hoặc xác nhận trên ứng dụng|Sai mật khẩu nhiều lần có thể bị khóa tạm, chờ hoặc khôi phục|Thử trình duyệt khác','Dạ, để vào cổng dịch vụ công bằng VNeID thì tài khoản cần kích hoạt mức 2 và ứng dụng là bản mới nhất. Anh/chị cập nhật giúp em, nếu chưa lên mức 2 thì mang CCCD ra công an phường/xã kích hoạt ạ.'],
 ['Hệ thống nghẽn, tải chậm, báo lỗi','nghẽn quá tải chậm lỗi hệ thống','Thử lại sáng sớm hoặc buổi tối|Xóa cache, thử Chrome/Edge, tắt VPN|Dùng mạng 4G để kiểm tra đường truyền|Kiểm tra mục tra cứu hồ sơ trước khi nộp lại để tránh trùng|Lỗi kéo dài: chụp màn hình phản ánh qua tổng đài','Dạ, cổng dịch vụ công đang quá tải nên chậm, không phải hồ sơ của anh/chị sai. Em sẽ thử lại lúc ít người dùng và kiểm tra hồ sơ đã gửi chưa trước khi nộp lại ạ.'],
 ['Không tải được tệp đính kèm','tệp tải lên dung lượng định dạng pdf','Kiểm tra định dạng (PDF, JPG) và dung lượng cho phép|Nén tệp hoặc chuyển sang PDF|Đổi tên tệp không dấu, không ký tự đặc biệt|Thử trình duyệt khác','Dạ, tệp của anh/chị có thể quá nặng hoặc sai định dạng nên không tải lên được. Em sẽ nén lại và chuyển sang PDF giúp anh/chị ạ.'],
 ['Nộp xong nhưng không thấy hồ sơ','hồ sơ của tôi mã hồ sơ tra cứu trạng thái','Vào mục hồ sơ của tôi hoặc tra cứu bằng mã hồ sơ|Kiểm tra email/SMS biên nhận|Đăng nhập đúng tài khoản đã nộp|Chưa có mã thì chưa gửi thành công, nộp lại sau khi xác nhận','Dạ, em sẽ kiểm tra mã hồ sơ và email biên nhận để xem đã gửi thành công chưa. Anh/chị chưa nộp lại để tránh trùng nhé ạ.']]},
{id:'dauthau',name:'Mạng đấu thầu quốc gia',icon:'📑',c:'#6d28d9',url:'https://muasamcong.mpi.gov.vn/',
 intro:'Hệ thống đăng ký nhà thầu, xem thông báo mời thầu và nộp hồ sơ dự thầu điện tử.',
 docs:[['Điều kiện sử dụng','Nhà thầu đăng ký tài khoản, nộp phí tham gia theo quy định và dùng chứng thư số hợp lệ để ký hồ sơ.'],['Nộp thầu cần sớm','Hồ sơ nặng, cần ký số và nhạy với trình duyệt. Nên nộp trước giờ đóng thầu và chụp màn hình xác nhận.'],['Môi trường máy','Chuẩn bị Windows, trình duyệt mới, trình ký/Java theo hướng dẫn hiện hành của hệ thống, mạng ổn định.']],
 errs:[
 ['Lỗi môi trường Java Agent hoặc trình ký','java agent trình ký ký số nộp thầu plugin','Cắm token, kiểm tra chứng thư còn hạn|Cài đúng Java và thành phần ký số theo hướng dẫn mới nhất của hệ thống|Thêm địa chỉ hệ thống vào Exception Site List trong Java Control Panel|Chạy trình duyệt/trình ký bằng Administrator, cho qua tường lửa|Đóng ứng dụng ký số khác đang chạy','Dạ, hệ thống đấu thầu cần một thành phần ký số chạy trên máy anh/chị, hiện đang lỗi nên chưa nộp được. Em cài lại và kiểm tra chữ ký số. Anh/chị cho em biết giờ đóng thầu để em ưu tiên ạ.'],
 ['Trình duyệt không tương thích khi nộp thầu','trình duyệt không tương thích chrome edge popup','Dùng Chrome/Edge bản mới, tắt chế độ tương thích|Cho phép popup và tải xuống|Tắt extension chặn quảng cáo, xóa cache|Nén tệp, dùng mạng dây ổn định|Nộp sớm, chụp xác nhận thành công','Dạ, trình duyệt hiện tại chưa phù hợp để nộp hồ sơ thầu. Em chuyển trình duyệt và chỉnh lại cài đặt. Anh/chị nên nộp sớm trước giờ đóng thầu ạ.'],

 ['Đăng ký tham gia hệ thống chưa được duyệt','đăng ký nhà thầu duyệt lệ phí trạng thái','Kiểm tra trạng thái phê duyệt trên hệ thống|Xác nhận đã nộp lệ phí tham gia theo quy định|Thông tin trùng với đăng ký doanh nghiệp|Hồ sơ thiếu thì bổ sung theo thông báo','Dạ, hồ sơ đăng ký của anh/chị đang chờ duyệt. Em kiểm tra xem đã nộp lệ phí và đủ giấy tờ chưa, rồi báo anh/chị ngay ạ.']]},
{id:'haiquan',name:'Hải quan',icon:'🚢',c:'#0e7490',url:'https://www.customs.gov.vn/',
 intro:'Khai báo hải quan điện tử (VNACCS/VCIS), đăng ký chữ ký số, nộp thuế xuất nhập khẩu.',
 docs:[['Các bước ban đầu','Doanh nghiệp đăng ký chữ ký số với hải quan, đăng ký tài khoản VNACCS tại dknsd.customs.gov.vn, rồi cài phần mềm khai báo.'],['Nộp thuế điện tử','Nộp tại epayment.customs.gov.vn, cần ủy quyền trích nợ với ngân hàng. Kiểm tra trình duyệt theo hướng dẫn của cổng.'],['Tờ khai bị phân luồng','Hệ thống tự động phân luồng sau khi đăng ký tờ khai. Cần đọc thông báo kết quả để biết bước tiếp theo.']],
 errs:[
 ['Không khai báo được vì chưa đăng ký chữ ký số hoặc tài khoản','vnaccs đăng ký chữ ký số tài khoản quản trị','Đăng ký chữ ký số với hải quan trên customs.gov.vn|Đăng ký tài khoản quản trị tại dknsd.customs.gov.vn, ký bằng token|Chờ hải quan phê duyệt rồi tra cứu thông tin VNACCS|Nhập thông tin tài khoản vào phần mềm khai|Kiểm tra token còn hạn','Dạ, để khai hải quan thì công ty cần đăng ký chữ ký số và tài khoản VNACCS với hải quan trước. Em sẽ làm các bước đó giúp anh/chị, cần cắm token để ký đăng ký ạ.'],
 ['Phần mềm khai không kết nối được hệ thống','phần mềm khai ecus kết nối tường lửa mạng','Kiểm tra mạng, thử mạng khác|Tắt hoặc cho phép phần mềm qua tường lửa, diệt virus|Cập nhật phần mềm khai lên bản mới|Kiểm tra thông tin tài khoản đã nhập đúng|Chạy bằng Administrator','Dạ, phần mềm khai chưa kết nối được tới hải quan nên em sẽ kiểm tra mạng, tường lửa và cập nhật phần mềm. Anh/chị chờ em một lát ạ.'],
 ['Không đăng nhập được cổng nộp thuế hải quan','epayment nộp thuế hải quan ủy quyền trích nợ','Dùng trình duyệt cổng hỗ trợ (theo hướng dẫn của cổng)|Kiểm tra tài khoản người nhập liệu đã đăng ký|Kiểm tra đã ủy quyền trích nợ với ngân hàng|Xóa cache, thử lại','Dạ, cổng nộp thuế hải quan cần tài khoản đúng và ủy quyền trích nợ ngân hàng. Em sẽ kiểm tra từng bước giúp anh/chị ạ.'],
 ['Tờ khai báo lỗi hoặc bị phân luồng','tờ khai lỗi phân luồng luồng vàng đỏ','Đọc kỹ thông báo lỗi của hệ thống|Sửa đúng chỉ tiêu bị báo lỗi (mã loại hình, HS...)|Khai bổ sung nếu cần|Luồng vàng/đỏ: chuẩn bị chứng từ theo yêu cầu','Dạ, tờ khai đang bị báo lỗi hoặc yêu cầu kiểm tra thêm. Em sẽ đọc thông báo và hướng dẫn mình chuẩn bị chứng từ. Anh/chị gửi em ảnh thông báo nhé ạ.']]}
];

<script>

document.addEventListener('change',e=>{const t=e.target;if(t.id==='bgf'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);BG.img=c.toDataURL('image/jpeg',.82);bgSave();bgApply();render()};im.src=fr.result};fr.readAsDataURL(t.files[0])}else if(t.id==='bgy'||t.id==='bgo'){bgSave();render()}else if(t.id==='bgp'){BG.pg=t.checked;bgApply();bgSave()}});

bgApply();if(route()==='settings')render();

/* ===== HIỆU ỨNG MÙA VÀ NGÀY LỄ (tự bật tắt) ===== */
const FXDEF=[]; /* hiệu ứng bật sẵn cho mọi khách, ví dụ ['dao','phaohoa'] */
const FX={
dao:{n:'Hoa đào · Tết',i:'🌸',e:['🌸','🌺','🌸','🏵️'],m:'fall'},
mai:{n:'Hoa mai · Tết',i:'🌼',e:['🌼','🌻','🌼','✨'],m:'fall'},
lixi:{n:'Lì xì · Tết',i:'🧧',e:['🧧','🧧','💰','✨','🪙'],m:'fall'},
phaohoa:{n:'Pháo hoa',i:'🎆',m:'fire'},
xuan:{n:'Mùa xuân',i:'🌷',e:['🌷','🌱','🦋','🌸','🐝'],m:'fall',s:.6},
ha:{n:'Mùa hè',i:'☀️',e:['🫧','🌊','☀️','🦋','🫧'],m:'rise'},
thu:{n:'Mùa thu',i:'🍂',e:['🍂','🍁','🍃','🍂'],m:'fall'},
dong:{n:'Mùa đông',i:'❄️',e:['❄️','❄','❅','❆'],m:'fall',s:.7},
mua:{n:'Mưa',i:'🌧️',m:'rain'},
sao:{n:'Sao đêm',i:'🌙',m:'stars'},
trungthu:{n:'Trung thu',i:'🏮',e:['🏮','🌕','⭐','🏮','🐇'],m:'rise'},
noel:{n:'Giáng sinh',i:'🎄',e:['🎄','🎁','❄️','⭐','🔔','🎅'],m:'fall'},
halloween:{n:'Halloween',i:'🎃',e:['🎃','👻','🦇','🕸️','🎃'],m:'fall'},
quockhanh:{n:'Quốc khánh · 30/4',i:'⭐',e:['⭐','🌟','🎉','🎊','❤️'],m:'fall'},
tim:{n:'Valentine · 8/3 · 20/10',i:'💖',e:['💖','🌹','💝','🌷','💗'],m:'rise'},
nhagiao:{n:'Nhà giáo 20/11',i:'📚',e:['📚','🌺','🎓','🌸','✏️'],m:'fall'},
tiec:{n:'Khai trương · Tiệc',i:'🎉',e:['🎉','🎊','🎈','✨','🥳'],m:'fall'}};
let fxOn=[],fxN=60,P={},F=[],Q=[],raf=0;
try{const o=JSON.parse(localStorage.fx||'null');o?(fxOn=o.on||[],fxN=o.n||60):fxOn=FXDEF.slice()}catch(e){}
const fxSave=()=>{try{localStorage.fx=JSON.stringify({on:fxOn,n:fxN})}catch(e){}};
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function mk(id,init){const d=FX[id],W=innerWidth,H=innerHeight,sz=d.m==='stars'?[6,14]:[16,32];return{e:d.e?d.e[Math.random()*d.e.length|0]:'',x:Math.random()*W,y:init||d.m==='stars'?Math.random()*H:(d.m==='rise'?H+30:-30),s:sz[0]+Math.random()*(sz[1]-sz[0]),v:(.4+Math.random()*1.1)*(d.s||1),ph:Math.random()*6.28,a:.55+Math.random()*.45,r:Math.random()*6.28,rs:(Math.random()-.5)*.04}}
function fire(W,H){if(Math.random()<.025)F.push({x:W*(.15+Math.random()*.7),y:H,ty:H*(.12+Math.random()*.35),h:Math.random()*360});
F=F.filter(r=>{r.y-=7;cx.fillStyle='#fff';cx.fillRect(r.x,r.y,2,8);if(r.y<=r.ty){for(let i=0;i<46;i++){const a=Math.PI*2*i/46,s=1.5+Math.random()*3;Q.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:r.h})}return false}return true});
Q=Q.filter(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.04;q.vx*=.99;q.l-=.014;if(q.l<=0)return false;cx.fillStyle='hsla('+q.h+',100%,60%,'+q.l+')';cx.beginPath();cx.arc(q.x,q.y,2,0,6.3);cx.fill();return true})}
function tick(){const W=innerWidth,H=innerHeight;cx.clearRect(0,0,W,H);if(!fxOn.length){raf=0;return}
fxOn.forEach(id=>{const d=FX[id];if(!d)return;if(d.m==='fire'){fire(W,H);return}
const tgt=Math.max(8,Math.round(fxN/Math.sqrt(fxOn.length))),a=P[id]=P[id]||[];while(a.length<tgt)a.push(mk(id,true));while(a.length>tgt)a.pop();
a.forEach(p=>{if(d.m==='rain'){p.y+=p.v*9+4;p.x-=1.2;if(p.y>H){p.y=-20;p.x=Math.random()*W}cx.strokeStyle='rgba(120,170,255,.55)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x+2,p.y-14);cx.stroke();return}
if(d.m==='stars'){p.ph+=.04;cx.globalAlpha=.3+.7*Math.abs(Math.sin(p.ph));cx.fillStyle='#fde68a';cx.beginPath();cx.arc(p.x,p.y,p.s/6,0,6.3);cx.fill();cx.globalAlpha=1;return}
const up=d.m==='rise';p.y+=up?-p.v*1.2:p.v*1.4;p.ph+=.02;p.x+=Math.sin(p.ph)*.7;p.r+=p.rs;if(up?p.y<-40:p.y>H+40){p.y=up?H+30:-30;p.x=Math.random()*W}
cx.save();cx.globalAlpha=p.a;cx.translate(p.x,p.y);if(!up)cx.rotate(p.r);cx.font=p.s+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.e,0,0);cx.restore()})});
raf=requestAnimationFrame(tick)}
const fxGo=()=>{if(!raf)raf=requestAnimationFrame(tick)};
function fxHint(){const d=new Date(),v=(d.getMonth()+1)*100+d.getDate();for(const[a,b,id]of[[115,225,'dao'],[210,215,'tim'],[305,309,'tim'],[426,502,'quockhanh'],[905,930,'trungthu'],[1018,1021,'tim'],[1024,1031,'halloween'],[1117,1121,'nhagiao'],[1215,1231,'noel']])if(v>=a&&v<=b)return id;const m=d.getMonth()+1;return m>=3&&m<=5?'xuan':m>=6&&m<=8?'ha':m>=9&&m<=11?'thu':'dong'}
const fb=document.createElement('button');fb.id='fxb';fb.textContent='🎊';fb.title='Hiệu ứng mùa và ngày lễ';fb.setAttribute('aria-label','Hiệu ứng mùa và ngày lễ');
const fp=document.createElement('div');fp.id='fxp';fp.className='hidden '+card;document.body.append(fb,fp);

fb.onclick=()=>{fxPanel();fp.classList.toggle('hidden')};
const fbShow=()=>{fb.style.display=ADM?'':'none';if(!ADM)fp.classList.add('hidden')};fbShow();addEventListener('hashchange',()=>setTimeout(fbShow,0));
document.addEventListener('click',e=>{if(e.target.closest('[data-tp]'))copy(TP,'Đã sao chép mẫu, dán vào Zalo và điền thông tin')});
fp.addEventListener('click',e=>{const b=e.target.closest('[data-fx]');if(!b)return;const id=b.dataset.fx;if(id==='off'){fxOn=[];P={};F=[];Q=[]}else fxOn=fxOn.includes(id)?fxOn.filter(x=>x!==id):[...fxOn,id];fxSave();fxPanel();fxGo()});
fp.addEventListener('input',e=>{if(e.target.id==='fxn'){fxN=+e.target.value;fxSave()}});
document.addEventListener('click',e=>{if(!fp.classList.contains('hidden')&&!e.composedPath().some(n=>n===fp||n===fb))fp.classList.add('hidden')});
if(fxOn.length)fxGo();

<script>
/* ===== ĐĂNG NHẬP QUẢN TRỊ BẰNG MÃ ===== */
const ADMH='54cfac492ea3c3e48f50bef08448d8333d46475183382f4eddc1dc0d841e161d';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let admBad=0,admLock=0;
const admHash=()=>{try{return localStorage.admh||ADMH}catch(e){return ADMH}};
function admOpen(){if(document.getElementById('admm'))return;const m=document.createElement('div');m.id='admm';m.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px';
m.innerHTML=`<div class="${card} p-6 w-full max-w-sm" style="animation:up .25s both"><div class="text-3xl">🔒</div><h2 class="mt-2 text-lg font-bold">Đăng nhập quản trị</h2><p class="mt-1 text-sm text-slate-500">Nhập mã quản trị để mở Cài đặt chung và các công cụ riêng.</p><input id="admi" type="password" autocomplete="off" placeholder="Mã quản trị" class="mt-4 w-full rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm outline-none focus:border-emerald-600"><label class="mt-3 flex items-center gap-2 text-xs text-slate-500"><input type="checkbox" data-adm="show"> Hiện mã đang gõ</label><p class="mt-1 text-xs text-slate-500">Gõ bằng bàn phím tiếng Anh: tắt Unikey hoặc chuyển sang chế độ E.</p><p id="adme" class="mt-2 text-xs text-rose-600 min-h-[1rem]"></p><div class="mt-3 flex justify-end gap-2"><button data-adm="x" class="rounded-full border border-stone-300 dark:border-slate-700 px-4 py-2 text-xs font-semibold">Hủy</button><button data-adm="go" class="rounded-full bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2 text-xs font-bold">Vào quản trị</button></div></div>`;
document.body.append(m);setTimeout(()=>document.getElementById('admi')?.focus(),50)}
async function admGo(){const i=document.getElementById('admi'),e=document.getElementById('adme');
if(Date.now()<admLock){e.textContent='Nhập sai nhiều lần, vui lòng chờ '+Math.ceil((admLock-Date.now())/1000)+' giây.';return}
if(!(window.crypto&&crypto.subtle)){e.textContent='Trình duyệt không hỗ trợ, hãy mở bằng Chrome hoặc Edge.';return}
if(await sha(i.value.trim())===admHash()){try{localStorage.adm='1'}catch(x){}ADM=true;document.getElementById('admm').remove();fbShow();location.hash==='#settings'?render():location.hash='settings'}
else{admBad++;if(admBad>=5){admLock=Date.now()+30000;admBad=0}e.textContent='Mã không đúng, vui lòng thử lại.';i.select()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-adm]');if(!b)return;const a=b.dataset.adm;if(a==='open')admOpen();else if(a==='x')document.getElementById('admm')?.remove();else if(a==='go')admGo();else if(a==='show')document.getElementById('admi').type=b.checked?'text':'password'});

/* ===== ĐỔI MÃ QUẢN TRỊ ===== */
function pwCard(){const inp=(id,ph)=>`<input id="${id}" type="password" autocomplete="off" placeholder="${ph}" class="w-full rounded-xl border border-stone-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm outline-none focus:border-emerald-600">`;
return `<div class="mt-4 ${card} p-5"><h2 class="font-bold">Đổi mã quản trị</h2><p class="text-sm text-slate-500 mt-1">Nhập mã hiện tại rồi đặt mã mới (từ 6 ký tự). Gõ bằng bàn phím tiếng Anh.</p><div class="mt-3 grid sm:grid-cols-3 gap-3">${inp('pwo','Mã hiện tại')}${inp('pw1','Mã mới')}${inp('pw2','Nhập lại mã mới')}</div><div class="mt-3 flex flex-wrap items-center gap-3"><button data-pw="go" class="rounded-full bg-emerald-700 hover:bg-emerald-800 text-white px-5 py-2 text-xs font-bold">Đổi mã</button><button data-pw="reset" class="text-xs underline text-slate-500">Quay về mã gốc trong file</button></div><p id="pwm" class="mt-2 text-xs min-h-[1rem]"></p><div id="pwr"></div></div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-pw]');if(!b)return;const a=b.dataset.pw,m=document.getElementById('pwm'),say=(t,ok)=>{m.textContent=t;m.className='mt-2 text-xs min-h-[1rem] '+(ok?'text-emerald-700':'text-rose-600')};
if(a==='reset'){try{localStorage.removeItem('admh')}catch(x){}return say('Đã quay về mã gốc trong file.',1)}
if(a==='cp'){return copy(b.dataset.t,'Đã sao chép dòng mã')}
if(!(window.crypto&&crypto.subtle))return say('Trình duyệt không hỗ trợ, hãy dùng Chrome hoặc Edge.');
const o=document.getElementById('pwo').value.trim(),n=document.getElementById('pw1').value.trim(),c=document.getElementById('pw2').value.trim();
if(await sha(o)!==admHash())return say('Mã hiện tại không đúng.');
if(n.length<6)return say('Mã mới cần ít nhất 6 ký tự.');
if(n!==c)return say('Hai lần nhập mã mới chưa giống nhau.');
const h=await sha(n);try{localStorage.admh=h}catch(x){return say('Trình duyệt không lưu được mã mới.')}
say('Đã đổi mã trên thiết bị này.',1);const line="const ADMH='"+h+"';";
document.getElementById('pwr').innerHTML=`<div class="mt-3 rounded-xl bg-stone-100 dark:bg-slate-800 p-4 text-xs leading-relaxed"><b>Để mã mới có tác dụng trên mọi thiết bị:</b> gửi dòng dưới đây cho người quản lý trang, hoặc thay vào file index.html ở dòng bắt đầu bằng const ADMH. Chưa thay thì thiết bị khác vẫn dùng mã cũ.<pre class="mt-2 whitespace-pre-wrap break-all font-mono">${line}</pre><button data-pw="cp" data-t="${line}" class="mt-2 rounded-full border border-stone-400 px-4 py-1.5 font-semibold">Copy dòng mã</button></div>`});
document.addEventListener('keydown',e=>{if(e.target.id==='admi'&&e.key==='Enter')admGo();if(e.key==='Escape')document.getElementById('admm')?.remove()});
</script>
